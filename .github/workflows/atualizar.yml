name: Atualizar dados

on:
  schedule:
    # Horário em UTC: 9h, 13h, 17h, 21h e 23h30 = 6h, 10h, 14h, 18h e 20h30 em Brasília
    - cron: "0 9,13,17,21 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coletor/requirements.txt
      - run: python coletor/coletar.py
      - name: Salvar se mudou
        run: |
          git config user.name "radar-robo"
          git config user.email "radar-robo@users.noreply.github.com"
          git add docs/dados.json docs/agenda.ics coletor/cache
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "dados: atualização automática"
            git push
          fi
